<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새싹나라유치원 추석 놀이 | 암호를 풀고 송편 상자를 찾아라!</title><meta name="description" content="우리 반의 추석 암호를 찾아 정답을 입력해요."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232b4274'/%3E%3Ccircle cx='20' cy='20' r='13' fill='%23ffd66d'/%3E%3C/svg%3E"><style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#263a5b;background:#fff7e6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid #1668bc;outline-offset:5px}[hidden]{display:none!important}.home{min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 18px 0;background:linear-gradient(#e4f4ff,#fff6db)}.eyebrow{font-size:1rem;font-weight:700;letter-spacing:.12em;color:#526781;margin:0 0 12px}h1{font-size:clamp(2rem,5vw,3.5rem);margin:0;color:#263a5b;line-height:1.3}h1 span{color:#a95b24}.scene{position:relative;width:min(850px,100%);margin:auto;display:grid;place-items:center}.scene img{display:block;width:100%;max-height:75svh;object-fit:contain}.start{position:absolute;top:47%;padding:23px 30px;border:4px solid #fff;border-radius:24px;background:#2b4274;color:white;font-size:clamp(1.2rem,3vw,1.8rem);font-weight:800;box-shadow:0 7px 0 #182947,0 15px 30px #18294735}.start:hover{background:#35548f}.page{min-height:100svh;max-width:960px;margin:auto;padding:26px 22px 40px}.back{background:transparent;color:#405371;padding:12px 0;font-weight:700;font-size:1rem}.page h2{font-size:clamp(1.8rem,5vw,2.7rem);text-align:center;margin:26px 0 12px}.hint{text-align:center;color:#58677b;line-height:1.7;margin:0 0 30px;font-size:1.1rem}.age{margin:25px 0 12px;font-size:1rem;color:#58677b}.classes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.class-button{background:#fff;border:2px solid #e6d8bc;border-radius:20px;min-height:100px;font-size:1.4rem;font-weight:800;color:#263a5b;box-shadow:0 4px 0 #e6d8bc}.class-button:hover{border-color:#b77836;background:#fff1cc}.quiz{max-width:760px}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin:38px 0 30px}.item{text-align:center;min-width:0}.picture{width:100%;aspect-ratio:1;display:grid;place-items:center;border:6px solid transparent;font-size:clamp(3.3rem,9vw,6rem);background:#fff;border-radius:6px}.picture.yellow{border-color:#edba08}.picture.blue{border-color:#2475d0}.picture.green{border-color:#249447}.label{display:block;font-size:1rem;margin:12px 0;min-height:1.5em}.number{width:100%;height:82px;border:2px solid #b5becb;border-radius:16px;text-align:center;font-size:2.3rem;font-weight:800;color:#263a5b;background:#fff}.number::placeholder{color:#8993a2}.check{width:100%;background:#2b4274;color:white;padding:21px;border-radius:18px;font-size:1.35rem;font-weight:800;box-shadow:0 5px 0 #182947}.result{min-height:84px;margin:24px 0 0;padding:18px;text-align:center;font-size:1.3rem;font-weight:800;line-height:1.6;border-radius:16px}.result:empty{padding:0}.success{background:#dff3dd;color:#245b30}.retry{background:#ffebcd;color:#805012}.celebrate{font-size:3rem;display:block}.small{font-size:1rem;font-weight:500;display:block}@media(max-width:600px){.home{padding-top:30px}.scene{margin:auto 0}.scene img{min-height:400px}.start{padding:19px 17px;white-space:nowrap}.classes{grid-template-columns:repeat(2,1fr)}.items{gap:12px}.page{padding:18px 16px 30px}.picture{border-width:5px}.label{font-size:.9rem}.number{height:72px}.hint{font-size:1rem}.items{margin-top:24px}}@media(prefers-reduced-motion:no-preference){.success{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.95)}to{transform:scale(1)}}}
</style></head><body>
<main>
<section id="home" class="home"><p class="eyebrow">새싹나라유치원 추석 놀이</p><h1>암호를 풀고<br><span>송편 상자를 찾아라!</span></h1><div class="scene"><img src="kindergarten.png" alt="새싹나라유치원 전경 그림"><button class="start" id="start">퀴즈 정답 입력하기</button></div></section>
<section id="choose" class="page" hidden><button class="back" id="homeBack">← 처음으로</button><h2 tabindex="-1">우리 반을 골라요</h2><p class="hint">어느 반 친구들인가요?</p><div id="classGroups"></div></section>
<section id="quiz" class="page quiz" hidden><button class="back" id="classBack">← 반 다시 고르기</button><h2 id="quizTitle" tabindex="-1"></h2><p class="hint">그림 아래에 찾은 숫자를 입력해 주세요.</p><form id="answerForm" novalidate><div class="items" id="items"></div><button class="check" type="submit">정답 확인하기</button><div id="result" class="result" role="status" aria-live="polite"></div></form></section>
</main><script>
const groups=[{age:'5세 · 만 3세',names:['새싹반','씨앗반','열매반','잎새반'],kind:'young'},{age:'6세 · 만 4세',names:['꽃무지반','물무지반','솔무지반'],kind:'older'},{age:'7세 · 만 5세',names:['성실한반'],kind:'older'}];
const puzzles={young:[{emoji:'🚗',label:'자동차',answer:4},{emoji:'🐟',label:'물고기',answer:3},{emoji:'🐞',label:'곤충',answer:2}],older:[{emoji:'🌺',label:'노란 사각형',color:'yellow',answer:9},{emoji:'🌺',label:'파란 사각형',color:'blue',answer:6},{emoji:'🌺',label:'녹색 사각형',color:'green',answer:2}]};
let current=null;const $=id=>document.getElementById(id);
function show(id){for(const name of ['home','choose','quiz'])$(name).hidden=name!==id;window.scrollTo(0,0);$(id).querySelector('h2,button')?.focus();}
function selectClass(name){const group=groups.find(g=>g.names.includes(name));if(!group)throw new Error('반 이름을 확인해 주세요.');current={name,kind:group.kind};$('quizTitle').textContent=name+'의 비밀 암호';$('items').replaceChildren();puzzles[group.kind].forEach((p,i)=>{const wrap=document.createElement('div');wrap.className='item';const picture=document.createElement('div');picture.className='picture '+(p.color||'');picture.textContent=p.emoji;picture.setAttribute('role','img');picture.setAttribute('aria-label',p.color?p.label+' 안의 무궁화':p.label);const label=document.createElement('label');label.className='label';label.htmlFor='number'+i;label.textContent=p.label;const input=document.createElement('input');input.id='number'+i;input.className='number';input.type='text';input.inputMode='numeric';input.pattern='[0-9]*';input.maxLength=2;input.placeholder='?';input.autocomplete='off';input.setAttribute('aria-label',(i+1)+'번째 '+(p.color?p.label+' 안의 무궁화':p.label)+' 숫자');input.addEventListener('input',()=>{input.value=input.value.replace(/[^0-9]/g,'');$('result').textContent='';$('result').className='result';});wrap.append(picture,label,input);$('items').append(wrap);});$('result').textContent='';$('result').className='result';show('quiz');return {className:name};}
function checkAnswers(){const values=[...$('items').querySelectorAll('input')].map(i=>i.value);const result=$('result');if(values.some(v=>!v.trim())){result.className='result retry';result.textContent='세 칸에 숫자를 모두 입력해 주세요.';return {status:'incomplete'};}const correct=puzzles[current.kind].every((p,i)=>Number(values[i])===p.answer);result.className='result '+(correct?'success':'retry');result.replaceChildren();if(correct){const icon=document.createElement('span');icon.className='celebrate';icon.textContent='🎉';const text=document.createElement('span');text.textContent='통과! 비밀 암호를 풀었어요!';result.append(icon,text);}else{result.textContent='아직 암호가 맞지 않아요. 다시 찾아볼까요?';}return {status:correct?'passed':'retry'};}
groups.forEach(g=>{const heading=document.createElement('h3');heading.className='age';heading.textContent=g.age;const row=document.createElement('div');row.className='classes';g.names.forEach(name=>{const button=document.createElement('button');button.className='class-button';button.textContent=name;button.onclick=()=>selectClass(name);row.append(button);});$('classGroups').append(heading,row);});
$('start').onclick=()=>show('choose');$('homeBack').onclick=()=>show('home');$('classBack').onclick=()=>show('choose');$('answerForm').onsubmit=e=>{e.preventDefault();checkAnswers();};
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'select_quiz_class',description:'반을 선택하여 정답 입력 화면을 엽니다.',inputSchema:{type:'object',properties:{className:{type:'string',enum:groups.flatMap(g=>g.names)}},required:['className'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>selectClass(input.className)})).catch(()=>{});}catch{}}
</script></body></html>
